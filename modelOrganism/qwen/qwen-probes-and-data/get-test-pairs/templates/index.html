<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pair Generation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Progress</h2>
            <div id="sidebar-list"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <h1>Test Pair Generation</h1>
                <div id="progress-indicator"></div>
            </div>

            <!-- Complete Screen -->
            <div id="complete-screen" style="display: none;">
                <div class="complete-message">
                    <h2>✓ All Pairs Complete!</h2>
                    <p>All responses have been approved and exported to <code>test-pairs-complete.py</code></p>
                </div>
            </div>

            <!-- Generation Screen -->
            <div id="generation-screen">
                <!-- Scenario and Prompt -->
                <div class="section">
                    <h2 id="scenario-title"></h2>
                    <div class="prompt-box">
                        <h3>Prompt</h3>
                        <p id="prompt-text"></p>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <div id="loading-spinner" class="spinner-container">
                    <div class="spinner"></div>
                    <p>Generating response...</p>
                </div>

                <!-- Generated Response -->
                <div id="response-container" style="display: none;">
                    <!-- Thinking Section -->
                    <div class="section">
                        <div class="section-header" onclick="toggleThinking()">
                            <h3>Thinking</h3>
                            <span id="thinking-toggle" class="toggle-icon">▼</span>
                        </div>
                        <div id="thinking-content" class="thinking-box"></div>
                    </div>

                    <!-- Response Section -->
                    <div class="section">
                        <h3>Response</h3>
                        <div id="response-content" class="response-box"></div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-container">
                        <button id="btn-previous" class="btn btn-secondary" onclick="navigatePrevious()">
                            ← Previous
                        </button>
                        <button id="btn-regenerate" class="btn btn-secondary" onclick="regenerate()">
                            ↻ Regenerate
                        </button>
                        <button id="btn-approve" class="btn btn-primary" onclick="approve()">
                            ✓ Approve & Continue
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
